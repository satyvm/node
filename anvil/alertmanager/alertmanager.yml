global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'

receivers:
  - name: 'default-receiver'
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/1493957600130371745/JdrgzBvM3QncaWuk50drW1XQkOLQgFWZJZdbVINwHgqO4hHjU6PkS5ZRMocIaDxsjGIm'
        title: '{{ template "discord.default.title" . }}'
        message: '{{ template "discord.default.message" . }}'
