services:
  execution:
    image: nethermind/nethermind:1.37.1
    container_name: nethermind
    restart: unless-stopped
    env_file:
      - ./ephemery/nodevars_env.txt
    ports:
      - "30303:30303/tcp"               # P2P
      - "30303:30303/udp"
      - "127.0.0.1:8545:8545"           # RPC
    # 8551 (Engine API) and 8008 (metrics)
    volumes:
      - ./data/nethermind:/data
      - ./ephemery:/network:ro
      - ./jwtsecret:/jwtsecret:ro
    command: >
      --config=none.json
      --datadir=/data
      --Init.ChainSpecPath=/network/chainspec.json
      --Network.Bootnodes=${NETHERMIND_BOOTNODES}
      --Sync.SnapSync=true
      --JsonRpc.Enabled=true
      --JsonRpc.Host=0.0.0.0
      --JsonRpc.Port=8545
      --JsonRpc.EngineHost=0.0.0.0
      --JsonRpc.EnginePort=8551
      --JsonRpc.JwtSecretFile=/jwtsecret
      --Metrics.Enabled=true
      --Metrics.ExposePort=8008

  consensus:
    image: sigp/lighthouse:v8.1.3
    container_name: lighthouse
    restart: unless-stopped
    env_file:
      - ./ephemery/nodevars_env.txt
    ports:
      - "9000:9000/tcp"                 # P2P
      - "9000:9000/udp"
      - "127.0.0.1:5052:5052"          # Beacon API
    # 5054 (metrics)
    volumes:
      - ./data/lighthouse:/data
      - ./ephemery:/network:ro
      - ./jwtsecret:/jwtsecret:ro
    command: >
      lighthouse bn
      --testnet-dir=/network
      --datadir=/data
      --execution-endpoint=http://execution:8551
      --execution-jwt=/jwtsecret
      --boot-nodes=${BOOTNODE_ENR_LIST}
      --checkpoint-sync-url=https://checkpoint-sync.ephemery.ethpandaops.io
      --http
      --http-address=0.0.0.0
      --metrics
      --metrics-address=0.0.0.0
      --metrics-port=5054
    depends_on:
      - execution

  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"           # UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'

  tempo:
    image: grafana/tempo:2.10.5
    container_name: tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" #http
      - "127.0.0.1:4317:4317" #otlp gRPC

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # UI
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093" # UI and API
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--docker_only=true'
      - '--store_container_labels=true'
      - '--disable_root_cgroup_stats=true'
      - '--housekeeping_interval=30s'
      - '--docker=unix:///var/run/docker.sock'
      - '--raw_cgroup_prefix_whitelist=/docker/'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  grafana-data:
  prometheus-data:
  tempo-data:
  alertmanager-data:
